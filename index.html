<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sports</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #1d4ed8;
        --accent: #f59e0b;
        --text: #111827;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(900px, 100%);
        background: var(--card);
        border-radius: 20px;
        box-shadow: 0 20px 45px rgba(29, 78, 216, 0.12);
        padding: 48px 32px;
        text-align: center;
      }

      .tag {
        display: inline-block;
        background: rgba(29, 78, 216, 0.08);
        color: var(--primary);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 12px;
        font-size: clamp(2.2rem, 5vw, 4rem);
      }

      p {
        margin: 0 auto;
        max-width: 620px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .stats {
        margin-top: 32px;
        display: grid;
        grid-template-columns: repeat(3, minmax(140px, 1fr));
        gap: 16px;
      }

      .stat {
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 14px;
        padding: 24px 16px;
      }

      .stat strong {
        display: block;
        font-size: 1.8rem;
        color: var(--primary);
      }

      .stat span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 640px) {
        .card {
          padding: 32px 20px;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="tag">Sports</div>
        <h1>Move Better. Play Harder.</h1>
        <p>
          这是一个简单的体育展示页面，适合直接部署后访问。
          你可以在这里展示球队、活动、训练计划或比赛信息。
        </p>

        <div class="stats">
          <div class="stat">
            <strong>24/7</strong>
            <span>训练支持</span>
          </div>
          <div class="stat">
            <strong>18+</strong>
            <span>运动项目</span>
          </div>
          <div class="stat">
            <strong>96%</strong>
            <span>用户满意</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
